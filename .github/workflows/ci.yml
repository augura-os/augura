name: CI

on:
  pull_request:
  push:
    branches: [main]
  # backend-embed-integration job 专用触发（见下）；主 CI 不装 onnxruntime
  schedule:
    - cron: "0 20 * * *" # 每天 UTC 20:00
  workflow_dispatch:

jobs:
  install-script-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash 3.2 compat (macOS system bash)
        run: |
          bash -n scripts/install.sh
          # macOS 自带 bash 3.2 会把变量名后的多字节字符（全角括号等）吞进
          # 变量名，set -u 下直接 unbound variable 崩溃。bash -n 抓不住
          # （运行期展开错误），所以禁止 "$VAR 后紧跟非 ASCII 字符"的写法。
          ! grep -P '\$[A-Za-z_][A-Za-z0-9_]*[\x80-\xff]' scripts/install.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: augura
          POSTGRES_PASSWORD: augura
          POSTGRES_DB: augura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U augura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与运行时镜像 infra/docker/api.Dockerfile（python:3.12-slim）对齐
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      # 注意：不装 requirements-embed.txt（可选 embedding 依赖，onnxruntime
      # 太重）——真实模型路径由下方 backend-embed-integration job 覆盖。
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest (incl. migrations + repositories against service Postgres)
        env:
          TEST_ADMIN_URL: postgresql+psycopg2://augura:augura@localhost:5432/postgres
          DATABASE_URL: postgresql+psycopg2://augura:augura@localhost:5432/augura
        run: python -m pytest tests -q

  # 真实 embedding 模型的 integration job：只在手动触发 / 定时跑（主 CI
  # 不装 onnxruntime，tests/test_embedding_integration.py 在那里自动 skip）。
  # 首次跑会真实下载 ~95MB 模型（HF 直连，失败会自动切 hf-mirror 重试）。
  backend-embed-integration:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
            apps/api/requirements-embed.txt
      - name: Install dependencies (incl. optional embed extra)
        run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-embed.txt
      - name: Pytest (real fastembed model)
        run: python -m pytest tests/test_embedding_integration.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc -b
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build
