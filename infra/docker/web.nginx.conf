server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2048m;

    # 前端静态产物在 /static/（vite assetsDir）——/assets 整段都是 API。
    # （历史上 bundle 也在 /assets/，静态目录把 API 路由顶成 301，见 #38/#52 后修复）
    location ~ ^/(upload|assets|graph|analysis|settings|creatives|review|derivations|dnas) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        client_max_body_size 2048m;
    }

    # vite 产物带内容哈希（/static/index-<hash>.js），可永久缓存；
    # index.html 每次发版都换引用，必须每次校验——否则浏览器缓存旧 HTML
    # 指向已不存在的旧 bundle，页面空白/缺功能（两次踩坑后的修复）。
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
