name: Publish images

# tag（v*）推送时构建并发布预构建镜像到 ghcr.io。
# 公私分离红线：构建前把 ip_pack 换成占位版——镜像里永远不含行业方法论。

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swap in OSS placeholder ip_pack
        run: cp ip_pack/oss_ip_pack.py apps/api/app/services/ip_pack.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/augura-os/augura-api:${{ github.ref_name }}
            ghcr.io/augura-os/augura-api:latest

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: |
            ghcr.io/augura-os/augura-web:${{ github.ref_name }}
            ghcr.io/augura-os/augura-web:latest
